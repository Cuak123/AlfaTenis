<!doctype html>
<html lang="es-PE">

<head>
  <!--
    Canonical host: https://alfatenis.com (the live Vercel deployment).
    If the client moves to a custom domain, it has to change in THREE places:
      1. every absolute URL in this file (canonical, og:*, twitter:*, JSON-LD)
      2. `seo.domain` in src/content/site.js
      3. public/robots.txt and public/sitemap.xml
    Keep one host only — no www/apex mix — or the canonicals split.

    Still TODO with the client:
      • Real logo. The favicon is a brand-coloured placeholder, not their mark.
      • Real geo coordinates. The old geo/ICBM tags pointed at central Lima,
        roughly 5 km from Monterrico, so they were removed rather than left wrong.
  -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f172a" />

  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="canonical" href="https://alfatenis.com/" />

  <!-- Primary Meta Tags -->
  <title>Alfa Tenis | Academia de tenis en Lima · desde los 3 años</title>
  <meta name="description"
    content="Clases de tenis en Lima desde los 3 años, de principiantes a competitivos. Tres sedes y entrenadores de circuito nacional. Agenda tu clase de prueba." />
  <meta name="robots" content="index, follow" />
  <meta name="author" content="Alfa Tenis" />

  <!-- Open Graph / Facebook / WhatsApp -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Alfa Tenis" />
  <meta property="og:locale" content="es_PE" />
  <meta property="og:url" content="https://alfatenis.com/" />
  <meta property="og:title" content="Alfa Tenis | Academia de Tenis en Lima" />
  <meta property="og:description"
    content="Clases de tenis en Lima desde los 3 años, de principiantes a competitivos. Agenda tu clase de prueba." />
  <meta property="og:image" content="https://alfatenis.com/images/og-image.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:type" content="image/jpeg" />
  <meta property="og:image:alt" content="Alfa Tenis — academia de tenis en Lima, desde los 3 años." />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Alfa Tenis | Academia de Tenis en Lima" />
  <meta name="twitter:description"
    content="Clases de tenis en Lima desde los 3 años, de principiantes a competitivos. Agenda tu clase de prueba." />
  <meta name="twitter:image" content="https://alfatenis.com/images/og-image.jpg" />

  <!-- Structured Data (JSON-LD).
       priceRange and sameAs are BACK as of 2026-11-24. Both were removed in
       November as unsupported claims; both are now evidenced. The range spans
       the cheapest single class to the dearest pack in the client's own price
       flyers, and the sameAs URLs were read off the client's own live site.

       No openingHoursSpecification: the client's sheet gives "06:00 am - 11 pm"
       for all three venues but names no days of the week, and the previous
       Mon-Fri 16:00-19:00 entry was a class timetable that the sheet does not
       support. Encoding either would be asserting days nobody stated.
       TODO (cliente): confirmar días y horario de clases, luego reponer. -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SportsClub",
      "name": "Alfa Tenis",
      "description": "Academia de tenis en Lima, desde los 3 años y de principiantes a competitivos, con entrenadores de circuito nacional.",
      "image": "https://alfatenis.com/images/og-image.jpg",
      "url": "https://alfatenis.com/",
      "telephone": "+51997222869",
      "email": "alfa.tenis.peru@gmail.com",
      "priceRange": "S/ 80 - S/ 880",
      "sameAs": [
        "https://www.instagram.com/alfa.tenis.peru",
        "https://www.facebook.com/AcademiaAlfaTenis",
        "https://www.tiktok.com/@alfa.tenis"
      ],
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "Jr. José Nicolás Rodrigo 100",
        "addressLocality": "Lima",
        "addressRegion": "Lima",
        "addressCountry": "PE"
      }
    }
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
