<!doctype html>
<html lang="es-PE">

<head>
  <!--
    Canonical host: https://alfa-tenis.vercel.app (the live Vercel deployment).
    If the client moves to a custom domain, it has to change in THREE places:
      1. every absolute URL in this file (canonical, og:*, twitter:*, JSON-LD)
      2. `seo.domain` in src/content/site.js
      3. public/robots.txt and public/sitemap.xml
    Keep one host only — no www/apex mix — or the canonicals split.

    Still TODO with the client:
      • Real logo. The favicon is a brand-coloured placeholder, not their mark.
      • Real geo coordinates. The old geo/ICBM tags pointed at central Lima,
        roughly 5 km from Monterrico, so they were removed rather than left wrong.
  -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f172a" />

  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="canonical" href="https://alfa-tenis.vercel.app/" />

  <!-- Primary Meta Tags -->
  <title>Alfa Tenis | Academia de Tenis para Niños y Jóvenes en Lima</title>
  <meta name="description"
    content="Academia de tenis para niños y jóvenes en Lima, con entrenadores calificados y enfoque en alto rendimiento. Agenda tu clase de prueba por WhatsApp." />
  <meta name="robots" content="index, follow" />
  <meta name="author" content="Alfa Tenis" />

  <!-- Open Graph / Facebook / WhatsApp -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Alfa Tenis" />
  <meta property="og:locale" content="es_PE" />
  <meta property="og:url" content="https://alfa-tenis.vercel.app/" />
  <meta property="og:title" content="Alfa Tenis | Academia de Tenis en Lima" />
  <meta property="og:description"
    content="Clases de tenis para niños y jóvenes en Lima, con enfoque en alto rendimiento. Agenda tu clase de prueba." />
  <meta property="og:image" content="https://alfa-tenis.vercel.app/images/og-image.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:type" content="image/jpeg" />
  <meta property="og:image:alt" content="Alfa Tenis — academia de tenis para niños y jóvenes en Lima." />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Alfa Tenis | Academia de Tenis en Lima" />
  <meta name="twitter:description"
    content="Clases de tenis para niños y jóvenes en Lima, con enfoque en alto rendimiento. Agenda tu clase de prueba." />
  <meta name="twitter:image" content="https://alfa-tenis.vercel.app/images/og-image.jpg" />

  <!-- Structured Data (JSON-LD).
       No priceRange: the client has not confirmed any price, and the old value
       was an unsupported claim. No sameAs: no social profile URLs yet.

       No openingHoursSpecification: the client's sheet gives "06:00 am - 11 pm"
       for all three venues but names no days of the week, and the previous
       Mon-Fri 16:00-19:00 entry was a class timetable that the sheet does not
       support. Encoding either would be asserting days nobody stated.
       TODO (cliente): confirmar días y horario de clases, luego reponer. -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SportsClub",
      "name": "Alfa Tenis",
      "description": "Academia de tenis para niños y jóvenes en Lima, con entrenadores calificados y enfoque en alto rendimiento.",
      "image": "https://alfa-tenis.vercel.app/images/og-image.jpg",
      "url": "https://alfa-tenis.vercel.app/",
      "telephone": "+51997222869",
      "email": "alfa.tenis.peru@gmail.com",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "Jr. José Nicolás Rodrigo 100",
        "addressLocality": "Lima",
        "addressRegion": "Lima",
        "addressCountry": "PE"
      }
    }
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
