<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flyer Verano 2026 - Alfa Tenis</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@300;400;600;800&display=swap"
        rel="stylesheet">

    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root {
            /* Palette: Dark Forest + Neon Lime */
            --bg-dark: #02201D;
            --card-bg: #05332F;
            --accent-neon: #CCFF00;
            --text-white: #FFFFFF;
            --text-gray: rgba(255, 255, 255, 0.6);
            --radius-bento: 24px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-white);
            font-family: 'Manrope', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
            /* Noise Texture */
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.04'/%3E%3C/svg%3E");
        }

        .flyer-container {
            width: 100%;
            max-width: 900px;
            /* Bento Grid Setup */
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 16px;
            aspect-ratio: 4/5;
            /* Aspecto vertical tipico de flyer */
        }

        /* --- Bento Item Commons --- */
        .bento-item {
            background-color: var(--card-bg);
            border-radius: var(--radius-bento);
            padding: 24px;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.05);
            /* Soft Shadow */
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
        }

        /* Gradient Overlay for subtle depth */
        .bento-item::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.02) 0%, rgba(0, 0, 0, 0.1) 100%);
            pointer-events: none;
        }

        /* --- 1. Header (Top Left, Large) --- */
        .header-section {
            grid-column: span 8;
            grid-row: span 2;
            background: linear-gradient(135deg, var(--card-bg) 0%, #004D40 100%);
            justify-content: center;
            padding-left: 40px;
            position: relative;
        }

        .header-title {
            font-family: 'Anton', sans-serif;
            font-size: 5rem;
            /* Ajustado para que entre en una linea si es necesario o stackeado mejor */
            line-height: 0.9;
            letter-spacing: -1px;
            text-transform: uppercase;
            color: white;
        }

        .header-subtitle {
            font-size: 1.5rem;
            font-weight: 300;
            color: var(--accent-neon);
            letter-spacing: 6px;
            margin-bottom: 10px;
            z-index: 10;
            text-transform: uppercase;
        }

        .accent-circle {
            position: absolute;
            width: 200px;
            height: 200px;
            background: var(--accent-neon);
            filter: blur(80px);
            opacity: 0.2;
            top: -50px;
            right: -50px;
            border-radius: 50%;
        }

        /* --- 2. Discount Badge (Top Right) --- */
        .badge-card {
            grid-column: span 4;
            grid-row: span 2;
            background: var(--accent-neon);
            color: var(--bg-dark);
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .badge-text {
            font-family: 'Anton', sans-serif;
            font-size: 4rem;
            line-height: 1;
        }

        .badge-sub {
            font-weight: 800;
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* --- 3. Main Image (Tall Left) --- */
        .image-card {
            grid-column: span 5;
            grid-row: span 4;
            padding: 0;
        }

        .image-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            /* Image Filter for stylistic look */
            filter: contrast(1.1) saturate(1.1);
        }

        .overlay-sticker {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            padding: 10px 20px;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 600;
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            z-index: 5;
        }

        /* --- 4. Categories (Middle) --- */
        .categories-card {
            grid-column: span 7;
            grid-row: span 2;
            padding: 30px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            /* Center content vertically to avoid empty space at bottom */
        }

        .section-label {
            color: var(--accent-neon);
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.9rem;
            margin-bottom: 25px;
            /* Increased margin */
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .cat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            /* Increased gap */
        }

        .cat-item {
            display: flex;
            flex-direction: column;
            /* Stacked for better fill */
            justify-content: center;
            align-items: flex-start;
            padding: 15px;
            background: rgba(0, 0, 0, 0.2);
            /* Added background for volume */
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .cat-name {
            font-weight: 800;
            /* Bolder */
            font-size: 1.2rem;
            /* Larger */
            margin-bottom: 4px;
        }

        .cat-age {
            font-size: 0.9rem;
            color: var(--text-gray);
            /* Removed background pill style in favor of clean text since item has bg */
            background: transparent;
            padding: 0;
            border-radius: 0;
        }

        /* --- 5. Info Box (Bottom Middle) --- */
        .info-card {
            grid-column: span 7;
            grid-row: span 2;
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding: 24px;
        }

        .info-block.main-date {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 15px;
            margin-bottom: 5px;
        }

        .info-value-lg {
            font-size: 1.8rem;
            font-weight: 800;
            color: white;
            letter-spacing: 1px;
        }

        .shift-container {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .section-label.highlight {
            color: var(--accent-neon);
            margin-bottom: 5px;
        }

        .shift-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            height: 100%;
        }

        .shift-box {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .shift-icon {
            color: var(--accent-neon);
            margin-bottom: 5px;
        }

        .shift-name {
            font-weight: 700;
            font-size: 0.9rem;
            margin-bottom: 2px;
        }

        .shift-time {
            font-size: 0.8rem;
            color: var(--text-gray);
        }

        .info-label {
            color: var(--accent-neon);
            font-size: 0.8rem;
            font-weight: 700;
        }

        /* --- 6. Footer CTA (Bottom Full) --- */
        .footer-card {
            grid-column: span 12;
            grid-row: span 1;
            background: white;
            color: var(--bg-dark);
            height: 90px;
            /* Specific height */
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
        }

        .brand-logo {
            font-weight: 900;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-ball {
            width: 24px;
            height: 24px;
            background: var(--accent-neon);
            border-radius: 50%;
        }

        .phone-cta {
            font-family: 'Anton', sans-serif;
            font-size: 2rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* --- Responsive --- */
        @media (max-width: 768px) {
            .flyer-container {
                display: flex;
                flex-direction: column;
                aspect-ratio: auto;
            }

            .header-title {
                font-size: 4rem;
            }

            .badge-card {
                padding: 40px;
            }

            .image-card {
                height: 300px;
            }

            .info-card {
                grid-template-columns: 1fr;
            }

            .footer-card {
                flex-direction: column;
                gap: 10px;
                justify-content: center;
                height: auto;
            }
        }
    </style>
</head>

    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <script>
        lucide.createIcons();

        function downloadFlyer() {
            const flyer = document.querySelector('.flyer-container');
            const btn = document.querySelector('.download-btn');

            // Ocultar botón temporalmente para que no salga en la foto
            btn.style.display = 'none';

            html2canvas(flyer, {
                scale: 2, // Mejor calidad (Retina like)
                backgroundColor: '#02201D',
                useCORS: true,
                // Forzar opciones para "burlar" la vista móvil si el usuario tiene ventana pequeña
                windowWidth: 1440,
                windowHeight: 900,
                // Asegurar que capture el contenedor en su ancho ideal
                onclone: (clonedDoc) => {
                    const clonedFlyer = clonedDoc.querySelector('.flyer-container');
                    // Forzamos el ancho para que el grid se renderice perfecto (sin encogerse)
                    clonedFlyer.style.width = '900px';
                    clonedFlyer.style.maxWidth = 'none';
                    clonedFlyer.style.margin = '0';
                    clonedFlyer.style.transform = 'none';
                    // Asegurar aspect ratio
                    clonedFlyer.style.aspectRatio = '4/5';
                }
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'flyer_alfa_tenis_2026.jpg';
                link.href = canvas.toDataURL('image/jpeg', 0.9);
                link.click();

                // Mostrar botón de nuevo
                btn.style.display = 'block';
            }).catch(err => {
                console.error("Error al generar imagen:", err);
                alert("Hubo un error al generar la imagen. Revisa la consola.");
                btn.style.display = 'block';
            });
        }
    </script>

    <!-- Download Button -->
    <button class="download-btn" onclick="downloadFlyer()">
        <i data-lucide="download"></i> Descargar JPG
    </button>

    <style>
        .download-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--accent-neon);
            color: var(--bg-dark);
            border: none;
            padding: 15px 30px;
            border-radius: 50px;
            font-family: 'Manrope', sans-serif;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1rem;
            z-index: 9999;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(204, 255, 0, 0.3);
        }

        .download-btn:active {
            transform: translateY(0);
        }
    </style>
